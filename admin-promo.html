<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/styleadmin.css"
    >

    <title>Admin Home</title>
</head>

<body>

    <nav>

        <h1>
            13th Reel E-Booking System Admin
        </h1>

        <div class="navsection">

            <button 
                type="button"
                onclick="window.location.href='adminhome.html'"
            >
                Manage Movies
            </button>

            <button
                type="button"
                onclick="window.location.href='admin-showrooms.html'"
            >
                Showrooms
            </button>

            <button
                type="button"
                class="login-btn"
                id="logout-button"
            >
                Logout
            </button>

        </div>

    </nav>


    <section class="adminhome">

        <h5>
            Welcome to the Promotions page.
        </h5>
        <section class="promotions-section" id="promotions-container">
            <h3>Current Promotions</h3>
            <ul id="promotions-list">
                <!-- List of promotions will be dynamically populated here -->
            </ul>
        </section>
    </section>

    <button type="button" class="add-card-btn" id="addCardButton">
            Add Promotion
        </button>
        <!-- Add/Edit Card Form -->
        <section class="payment-info" id="cardFormSection">
            <h3 id="cardFormTitle">Add Promotion</h3>

            <form id="cardForm" class="login-form">

                <div class="form-group">
                    <label for="Title">Title:</label>
                    <input type="text" id="Title"
                           autocomplete="off" 
                           placeholder="Enter movie title"
                           required>
                </div>
                <div class="form-group">
                    <label for="Description">Description:</label>
                    <input type="text" id="Description"
                           autocomplete="off" 
                           placeholder="Enter movie description"
                           required>
                </div>
                <div class="form-group">
                    <label for="Discount">Discount:</label>
                    <input type="text" id="Discount"
                           autocomplete="off" 
                           placeholder="Enter discount percentage"
                           required>
                </div>
                <div class="form-group">
                    <label for="ExpiryDate">Expiry Date:</label>
                    <input type="date" id="ExpiryDate"
                           autocomplete="off" 
                           required>
                </div>
                <button type="submit" id="saveCardButton">
                    Save Promotion
            </button>
            </form>
        </section>

    <script>

    function addPromotion() {
        const container = document.getElementById('promotions-container');
        const input = document.createElement('input');
        input.type = 'text';
        input.name = 'promotions[]';
        input.placeholder = 'Enter promotion code';
        input.required = true;
        container.appendChild(input);
    }
    </script>


    <br>
    <br>


    <footer>

        <p>
            &copy; 2024 Movie Poster Title.
            All rights reserved.
        </p>

    </footer>

    <script src="admin-promo.js"></script>
</body>

</html>
