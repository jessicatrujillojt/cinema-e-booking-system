<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <title>Forgot Password</title>
</head>

<body>

    <nav>

        <h1>
            Movie E-Booking System
        </h1>

        <div class="navsection">

            <p>
                <a href="home.html">
                    Home
                </a>
            </p>

            <p>
                <a href="browse.html">
                    Browse
                </a>
            </p>

            <p id="profileNav" hidden>
                <a href="profile.html">
                    Profile
                </a>
            </p>

            <p id="loginNav" hidden>
                <button
                    type="button"
                    class="login-btn"
                    onclick="location.href='login.html'"
                >
                    Login
                </button>
            </p>

            <section
                class="logout-btn"
                id="logoutNav"
                hidden
            >
                <p>
                    <button
                        type="button"
                        class="login-btn"
                        id="logoutButton"
                    >
                        Logout
                    </button>
                </p>
            </section>

        </div>

    </nav>


    <section class="login-section">

        <h2>
            Forgot Password
        </h2>

        <h5>
            Enter your email below to receive a password reset link:
        </h5>


        <form
            class="login-form"
            id="forgot-password-form"
        >

            <label for="email">
                Email:
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <br>


            <button type="submit">
                Reset Password
            </button>

        </form>


        <p id="forgot-password-message"></p>


        <div class="login-links">

            <h5>
                Don't have an existing account?

                <a
                    class="register-link"
                    href="register.html"
                >
                    Register Here
                </a>
            </h5>

        </div>

    </section>


    <script src="password.js"></script>
    <script src="nav.js"></script>

</body>

</html>
