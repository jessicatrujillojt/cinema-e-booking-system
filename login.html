<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
    <!-- login-section, login-form, sectionfooter, register-link -->
<body>
    <!-- Navigation -->
    <nav>
        <h1> Movie E-Booking System</h1>
        <div class="navsection">
            <p> <a href="home.html">Home</a></p>
            <p> <a href="browse.html">Browse</a></p>
            <p> <a href="profile.html">Profile</a> </p>  <!-- Should only be visible when logged in -->
            <p><button type="button" class="login-btn" onclick="location.href='login.html'">Login</button></p> <!-- Should only be visible when logged out -->
            <section class="logout-btn">
            <p> <button type="button" class="login-btn" onclick="location.href='login.html'">Logout</button></p> <!-- Should only be visible when logged in -->
            </section>
        </div>
    </nav>
    <section class="login-section">
        <h2>Login</h2>
        <form class="login-form" action="#" method="post">
            <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" autocomplete="current-password" id="password" name="password" required>
            </div>
            <button type="button" onclick="location.href='home.html'">Login</button>
        </form>

        <div class="login-links">
        <h5>Don't have an existing account? <a class="register-link" href="register.html">Register Here!</a></h5>
        <h5>Forgot your password? <a class="register-link" href="reset.html">Reset Here!</a></h5>
        </div>
    </section>
</body>
</html>
