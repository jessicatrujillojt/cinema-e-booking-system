<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <title>Login</title>
</head>

<body>

    <nav>
        <h1>Movie E-Booking System Title</h1>

        <div class="navsection">
            <p>
                <a href="home.html">Home</a>
            </p>

            <p>
                <a href="browse.html">Browse</a>
            </p>
        </div>
    </nav>


    <section class="login-section">

        <h2>Login</h2>

        <form
            class="login-form"
            id="login-form"
        >

            <div class="form-group">

                <label for="emailAddress">
                    Email:
                </label>

                <input
                    type="email"
                    id="emailAddress"
                    name="emailAddress"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password:
                </label>

                <input
                    type="password"
                    autocomplete="current-password"
                    id="password"
                    name="password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <p id="login-message"></p>


        <div class="login-links">

            <h5>
                Don't have an existing account?

                <a
                    class="register-link"
                    href="register.html"
                >
                    Register Here!
                </a>
            </h5>


            <h5>
                Forgot your password?

                <a
                    class="register-link"
                    href="password.html"
                >
                    Reset Here!
                </a>
            </h5>

        </div>

    </section>


    <script src="login.js"></script>

</body>
</html>
