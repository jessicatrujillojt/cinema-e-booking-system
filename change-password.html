<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Change Password | Cinema E-Booking
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <nav>

        <div class="navsection">

            <h1>
                Cinema E-Booking
            </h1>

            <p>
                <a href="home.html">
                    Home
                </a>
            </p>

            <p>
                <a href="browse.html">
                    Browse Movies
                </a>
            </p>

            <p>
                <a href="edit-profile.html">
                    Edit Profile
                </a>
            </p>

        </div>

    </nav>


    <main class="login-section">

        <h2>
            Change Password
        </h2>

        <form
            class="login-form"
            id="change-password-form"
        >

            <div class="form-group">

                <label for="currentPassword">
                    Current Password:
                </label>

                <input
                    type="password"
                    id="currentPassword"
                    name="currentPassword"
                    autocomplete="current-password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="newPassword">
                    New Password:
                </label>

                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password:
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button type="submit">
                Change Password
            </button>

        </form>


        <p id="change-password-message"></p>


        <div class="login-links">

            <h5>

                <a
                    class="register-link"
                    href="edit-profile.html"
                >
                    Back to Profile
                </a>

            </h5>

        </div>

    </main>


    <script src="change-password.js"></script>

</body>

</html>
