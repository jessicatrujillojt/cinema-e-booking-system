<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <title>Payment - Movie E-Booking System</title>
</head>

<body>

    <nav>

        <h1>
            Movie E-Booking System
        </h1>

        <div class="navsection">

            <p>
                <a href="home.html">Home</a>
            </p>

            <p>
                <a href="browse.html">Browse</a>
            </p>

            <p>
                <a href="profile.html">Profile</a>
            </p>

        </div>

    </nav>


    <main class="booking-page">

        <section class="booking-summary">

            <h2>
                Payment
            </h2>

            <p>
                Enter your payment information below.
            </p>

            <p>
                Payment processing is not completed in this sprint.
            </p>


            <form id="paymentForm">

                <div class="form-group">

                    <label for="cardholderName">
                        Cardholder Name:
                    </label>

                    <input
                        type="text"
                        id="cardholderName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="cardNumber">
                        Card Number:
                    </label>

                    <input
                        type="text"
                        id="cardNumber"
                        placeholder="1234 5678 9012 3456"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="expiration">
                        Expiration Date:
                    </label>

                    <input
                        type="text"
                        id="expiration"
                        placeholder="MM/YY"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="cvv">
                        CVV:
                    </label>

                    <input
                        type="text"
                        id="cvv"
                        placeholder="123"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="checkout-button"
                >
                    Submit Payment
                </button>

            </form>


            <p
                id="paymentMessage"
                role="status"
            ></p>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2024 Movie E-Booking System.
            All rights reserved.
        </p>

    </footer>


    <script src="payment-page.js"></script>

</body>

</html>
