<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <nav>
        <h1>Movie E-Booking System</h1>

        <div class="navsection">

            <p><a href="home.html">Home</a></p>
            <p><a href="browse.html">Browse</a></p>

            <!-- Profile: visible only when logged in -->
            <p id="profileNav" hidden>
                <a href="profile.html">Profile</a>
            </p>

            <!-- Login: visible only when logged out -->
            <p id="loginNav" hidden>
                <button type="button"
                        class="login-btn"
                        onclick="location.href='login.html'">
                    Login
                </button>
            </p>

            <!-- Logout: visible only when logged in -->
            <section class="logout-btn" id="logoutNav" hidden>
                <p>
                    <button type="button"
                            class="login-btn"
                            id="logoutButton">
                        Logout
                    </button>
                </p>
            </section>

        </div>
    </nav>
    <main class="browse-page">
        <h2>Your Favorite Movies</h2>
        <section class="movie-grid" id="favorites-grid"></section>
        <p id="no-favorites" style="display: none;">
            You have no favorite movies yet. Browse and add some!
        </p>
    </main>
    <!-- Footer -->
    <footer>
        <p>&copy; 2024 Movie E-Booking System. All rights reserved.</p>
    </footer>
    <script src="favorite-movies.js"></script>
    <script src="nav.js"></script>
</body>
</html>
