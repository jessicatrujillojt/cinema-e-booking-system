<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/styleadmin.css"
    >

    <title>Admin Home</title>
</head>

<body>

    <nav>

        <h1>
            13th Reel E-Booking System Admin
        </h1>

        <div class="navsection">

        <button
         type="button"
         onclick="document.getElementById('cardFormSection').scrollIntoView({ behavior: 'smooth' })"
        >
          Manage Movies
        </button>

        <button
            type="button"
            onclick="window.location.href='admin-promo.html'"
        >
            Manage Promotions
        </button>

        <button
            type="button"
            onclick="document.getElementById('showtimeSection').scrollIntoView({ behavior: 'smooth' })"
        >
            Manage Showtimes
        </button>

        <button
            type="button"
            class="login-btn"
            id="logout-button"
        >
            Logout
        </button>

</div>

    </nav>


    <section class="adminhome">

        <h5>
            Welcome to the Admin Home page.
            Here you can manage movie listings,
            promotions, users, and showtimes.
        </h5>

    </section>


    <!-- Movie Table -->
    <table>

        <tbody id="movieTableBody">

            <tr>
                <th>Movie Image</th>
                <th>Movie Title</th>
                <th>Genre</th>
                <th>Showroom</th>
                <th>Rating</th>
                <th>Visibility</th>
                <th>Actions</th>
            </tr>
        </tbody>
    </table>


    <!-- Add Movie Section -->
    <button
        type="button"
        class="add-card-btn"
        id="addCardButton"
    >
        Add Movie
    </button>


    <section
        class="payment-info"
        id="cardFormSection"
    >

        <h3 id="cardFormTitle">
            Add Movie
        </h3>

        <form
            id="cardForm"
            class="login-form"
        >

            <div class="form-group">

                <label for="Title">
                    Title:
                </label>

                <input
                    type="text"
                    id="Title"
                    autocomplete="off"
                    placeholder="Enter movie title"
                    required
                >

            </div>


            <div class="form-group">

                <label for="Description">
                    Description:
                </label>

                <input
                    type="text"
                    id="Description"
                    autocomplete="off"
                    placeholder="Enter movie description"
                    required
                >

            </div>


            <div class="form-group">

                <label for="PosterURL">
                    Poster URL:
                </label>

                <input
                    type="text"
                    id="PosterURL"
                    autocomplete="off"
                    required
                >

            </div>


            <div class="form-group">

                <label for="TrailerURL">
                    Trailer URL:
                </label>

                <input
                    type="text"
                    id="TrailerURL"
                    autocomplete="off"
                    required
                >

            </div>


            <div class="form-group">

                <label for="rating">
                    Rating:
                </label>

                <select
                    id="rating"
                    required
                >
                    <option value="G">G</option>
                    <option value="PG">PG</option>
                    <option value="PG-13">PG-13</option>
                    <option value="R">R</option>
                    <option value="NC-17">NC-17</option>
                    <option value="NR">NR</option>
                </select>
            </div>


            <div class="form-group">

                <label for="Genre">
                    Genre:
                </label>

                <select
                    id="Genre"
                    required
                >
                    <option value="Action">Action</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Drama">Drama</option>
                    <option value="Horror">Horror</option>
                    <option value="Romance">Romance</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Thriller">Thriller</option>
                    <option value="Adventure">Adventure</option>
                    <option value="Animation">Animation</option>
                    <option value="Biography">Biography</option>
                    <option value="Crime">Crime</option>
                    <option value="Documentary">Documentary</option>
                    <option value="Family">Family</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="History">History</option>
                    <option value="Musical">Musical</option>
                    <option value="Mystery">Mystery</option>
                    <option value="War">War</option>
                </select>

            </div>


            <div class="form-group">

                <label for="status">
                    Status:
                </label>

                <select
                    id="status"
                    required
                >
                    <option value="Currently Running">
                        Currently Running
                    </option>

                    <option value="Coming Soon">
                        Coming Soon
                    </option>
                </select>

            </div>


            <button
                type="submit"
                id="saveCardButton"
            >
                Save Movie
            </button>


            <button
                type="button"
                id="cancelCardButton"
            >
                Cancel
            </button>

        </form>

    </section>


    <!-- Schedule Showtime Section -->
    <section 
        class="payment-info"
        id="showtimeSection"
    >

        <h3>
            Schedule Showtime
        </h3>

        <form
            id="showtimeForm"
            class="login-form"
        >

            <div class="form-group">

                <label for="showtimeMovie">
                    Movie:
                </label>

                <select
                    id="showtimeMovie"
                    required
                >
                    <option value="">
                        Select a movie
                    </option>
                </select>

            </div>


            <div class="form-group">

                <label for="showroom">
                    Showroom:
                </label>

                <select
                    id="showroom"
                    required
                >
                    <option value="">
                        Select a showroom
                    </option>
                </select>

            </div>


            <div class="form-group">

                <label for="event-date">
                    Date:
                </label>

                <input
                    type="date"
                    id="event-date"
                    required
                >

            </div>


            <div class="form-group">

                <label for="showtime">
                    Time:
                </label>

                <input
                    type="time"
                    id="showtime"
                    required
                >

            </div>


            <button type="submit">
                Add Showtime
            </button>

        </form>

    </section>


    <br>
    <br>


    <footer>

        <p>
            &copy; 2024 Movie Poster Title.
            All rights reserved.
        </p>

    </footer>


    <script src="adminhome.js"></script>

</body>

</html>
