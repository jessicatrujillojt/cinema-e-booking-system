<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <title>Register</title>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <h1>Prototype Booking Page</h1>

        <div class="navsection">
            <p><a href="home.html">Home</a></p>
            <p><a href="browse.html">Browse</a></p>

            <p>
                <a class="login-btn" href="login.html">
                    Login
                </a>
            </p>
        </div>
    </nav>

    <section class="login-section">

        <h2>Register</h2>

        <form class="login-form" id="register-form">

            <label for="firstName">First Name:</label>
            <input
                type="text"
                id="firstName"
                name="firstName"
                required
            >

            <br>

            <label for="lastName">Last Name:</label>
            <input
                type="text"
                id="lastName"
                name="lastName"
                required
            >

            <br>

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <br>

            <label for="phoneNumber">Phone Number:</label>
            <input
                type="tel"
                id="phoneNumber"
                name="phoneNumber"
                required
            >

            <br>

            <label for="password">Password:</label>
            <input
                type="password"
                autocomplete="new-password"
                id="password"
                name="password"
                required
            >

            <br>

            <label>
                <input
                    type="checkbox"
                    id="promotionSubscriptions"
                >
                Receive promotional emails
            </label>

            <br>

            <button type="submit">
                Register
            </button>

        </form>

        <p id="register-message"></p>

        <div class="login-links">
            <h5>
                Have an existing account?
                <a class="register-link" href="login.html">
                    Login Here!
                </a>
            </h5>
        </div>

    </section>

    <script src="register.js"></script>

</body>
</html>
