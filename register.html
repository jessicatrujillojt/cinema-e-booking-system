<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
    <!-- login-section, login-form, sectionfooter, register-link -->
<body>
    <!-- Navigation -->
    <nav>
         <h1> Prototype Booking Page </h1>
        <div class="navsection">
            <p> <a href="home.html">Home</a></p>
            <p> <a href="browse.html">Browse</a></p>
            <p><button type="button" class="login-btn" href="login.html">
                 Login
             </button>
            </p>
        </div>
    </nav>
    <section class="login-section">
        <h2>Register</h2>
        <form class="login-form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" autocomplete="new-password" id="password" name="password" required>
            <br>

            <button type="submit">Register</button>
        </form>
    
        <div class="login-links">
        <h5>Have an existing account? <a class="register-link" href="login.html">Login Here!</a></h5>
        </div>
    </section>
</body>
</html>
