<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <title>Register - 13th Reel</title>
</head>

<body>

    <nav>
        <h1>Movie E-Booking System</h1>

        <div class="navsection">
            <p><a href="home.html">Home</a></p>
            <p><a href="browse.html">Browse</a></p>
            <p><a href="profile.html">Profile</a></p>

            <p>
                <button type="button" class="login-btn"
                    onclick="location.href='login.html'">
                    Login
                </button>
            </p>
        </div>
    </nav>

    <section class="login-section">
        <h2>Register</h2>

        <form class="login-form" id="registerForm">

            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" required>
            <br>

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" required>
            <br>

            <label for="email">Email:</label>
            <input type="email" id="email" required>
            <br>

            <label for="phoneNumber">Phone Number:</label>
            <input type="tel" id="phoneNumber" required>
            <br>

            <label for="password">Password:</label>
            <input type="password"
                   id="password"
                   autocomplete="new-password"
                   required>
            <br>

            <label for="promotionSubscriptions">
                <input type="checkbox" id="promotionSubscriptions">
                Subscribe to promotional emails
            </label>
            <br>

            <button type="submit">Register</button>

            <p id="registerMessage" role="status"></p>
        </form>

        <div class="login-links">
            <h5>
                Have an existing account?
                <a class="register-link" href="login.html">
                    Login Here!
                </a>
            </h5>
        </div>
    </section>

    <script src="register.js"></script>

</body>
</html>
