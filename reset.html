<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <title>Reset Password</title>
</head>

<body>

    <nav>
        <h1>Prototype Booking Page</h1>

        <div class="navsection">
            <p><a href="home.html">Home</a></p>
            <p><a href="browse.html">Browse</a></p>
            <p><a class="login-btn" href="login.html">Login</a></p>
        </div>
    </nav>

    <section class="login-section">

        <h2>Reset Password</h2>

        <h5>
            Enter your new password below:
        </h5>

        <form class="login-form" id="reset-form">

            <label for="password">
                New Password:
            </label>

            <input
                type="password"
                autocomplete="new-password"
                id="password"
                name="password"
                required
            >

            <br>

            <label for="confirm-password">
                Re-enter Password:
            </label>

            <input
                type="password"
                autocomplete="new-password"
                id="confirm-password"
                name="confirm-password"
                required
            >

            <br>

            <button type="submit">
                Reset Password
            </button>

        </form>

        <p id="reset-message"></p>

        <div class="login-links">

            <h5>
                Don't have an existing account?
                <a
                    class="register-link"
                    href="register.html"
                >
                    Register Here!
                </a>
            </h5>

        </div>

    </section>

    <script src="reset.js"></script>

</body>
</html>
