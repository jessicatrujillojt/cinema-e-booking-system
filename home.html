<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <title>Home</title>
</head>

<body>

    <nav>

        <h1>
            Movie E-Booking System
        </h1>

        <div class="navsection">

            <p>
                <a href="browse.html">
                    Browse
                </a>
            </p>

            <p id="profileNav" hidden>
                <a href="profile.html">
                    Profile
                </a>
            </p>

            <p id="loginNav" hidden>
                <button
                    type="button"
                    class="login-btn"
                    onclick="location.href='login.html'"
                >
                    Login
                </button>
            </p>

            <section
                class="logout-btn"
                id="logoutNav"
                hidden
            >
                <p>
                    <button
                        type="button"
                        class="login-btn"
                        id="logoutButton"
                    >
                        Logout
                    </button>
                </p>
            </section>

        </div>

    </nav>


    <div class="slide">

        <div class="frame">

            <div class="imgbase">

                <img
                    class="imgcover"
                    src="img/trailerbase.jpg"
                    alt="Pearl Movie Poster"
                >

            </div>

        </div>

    </div>


    <br>
    <br>


    <h2>
        Featured Movies
    </h2>

    <div
        class="card-container"
        id="featured-movies"
    >
    </div>


    <br>
    <br>


    <h2>
        Movies Coming Soon
    </h2>

    <div
        class="card-container"
        id="coming-soon-movies"
    >
    </div>


    <br>
    <br>


    <footer>

        <p>
            &copy; 2024 Movie Poster Title.
            All rights reserved.
        </p>

    </footer>


    <script src="home.js"></script>
    <script src="nav.js"></script>

</body>

</html>
