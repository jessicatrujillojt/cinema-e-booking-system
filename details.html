<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <h1> Movie E-Booking System Title </h1>
        <div class="navsection">
            <p> <a href="home.html">Home</a></p>
            <p> <a href="browse.html">Browse</a></p>
            <p><button type="button" class="login-btn" onclick="location.href='login.html'">Login</button></p>
            <p><button type="button" class="login-btn" onclick="location.href='profile.html'">Profile</button></p>
        </div>
    </nav>

    <main class="movie-details-page">
        
        <section class="movie-hero">
            <div class="movie-poster-section">
                <img id="movie-poster" class="detail-poster" src="img/movieposter.jpg" alt="Movie Poster">
            </div>

            <div class="movie-info">
            <p class="details-eyebrow">NOW SHOWING</p>
            <h1 id="movie-title">Movie Title Here</h1>
                
            <div class="rating-badge"> 
            <span>Rating</span>
            <strong id="movie-rating">Movie rating here</strong>
            </div>

            <h2>Summary</h2>
            <p id="movie-description">Movie description here</p>
            </div>
        </section>

    <section class="trailer-section">
        <!-- <h2>Trailer</h2> -->
        <div class="trailer-frame">
            <iframe
                id="movie-trailer"
                class="imgcover"
                title="Movie Trailer"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
        </div>
    </section>
    
    <section class="showtimes-section">
        <h2>Showtimes</h2>
        <p>Click on a showtime to book your tickets!</p>
        <div class="showtimes">
            <div class="detailed" id="showtime-buttons">
            </div>
        </div>
    </section>
</main>

    <footer>
    <p> &copy; 2024 Movie Poster Title. All rights reserved.</p>
    </footer>
    <script src="details.js"></script>
</body>
</html>
