<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <nav>
        <h1> Movie E-Booking System Title </h1>
        <div class="navsection">
            <p> <a href="home.html">Home</a></p>
            <p> <a href="browse.html">Browse</a></p>
            <p><button type="button" class="login-btn" href="login.html">Login</button></p>
        </div>
    </nav>

    <div class="movie-poster-section">
        <img id="movie-poster" class="detail-poster" src="" alt="Movie Poster">
    </div>

    <div class="frame">
        <iframe
            id="movie-trailer"
            class="imgcover"
            title="Movie Trailer"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
    </div>
    <h1 id="movie-title">Movie Title Here</h1>
    <h3>Summary</h3>
    <p id="movie-description">Movie description here</p>
    <h3>Rating</h3>
    <p id="movie-rating">Movie rating here</p>

    <h2>Showtimes</h2>
    <div class="showtimes">
        <div class="detailed" id="showtime-buttons">
        </div>
    </div>
    <br>
    <br>
    <br>
    <footer>
    <p> &copy; 2024 Movie Poster Title. All rights reserved.</p>
    </footer>
    <script src="details.js"></script>
</body>
</html>
